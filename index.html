<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Squat Depth Analyzer</title>
  
  <!-- MediaPipe Pose Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="styles.css?v=1.0.3">
</head>
<body>

  <div class="app-container">
    <!-- Header with Revision Counter -->
    <header class="app-header">
      <h1>Squat Depth Analyzer</h1>
      <div class="version-tag">
        Build: <span id="app-version">v0.0.0</span>
      </div>
    </header>

    <!-- Main Video & Canvas Viewport Frame -->
    <div class="viewport-container" id="viewport-frame">
      <video id="uploaded-video" playsinline muted webkit-playsinline></video>
      <canvas id="output-canvas"></canvas>
    </div>

    <!-- Status & Analysis Panel -->
    <div class="analysis-panel">
      <div id="status-badge" class="badge">NO VIDEO LOADED</div>
      
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-title">Knee Angle</span>
          <span id="knee-angle" class="metric-value">--°</span>
        </div>
        <div class="metric-card">
          <span class="metric-title">Depth Status</span>
          <span id="depth-status" class="metric-value">--</span>
        </div>
      </div>
    </div>

    <!-- Controls & File Upload -->
    <div class="controls-panel">
      <div class="file-input-wrapper">
        <label for="video-upload" class="btn-upload">Select / Record Video</label>
        <input type="file" id="video-upload" accept="video/*">
      </div>

      <div class="playback-controls">
        <button id="btn-prev-frame" disabled>&laquo; Prev</button>
        <button id="btn-play-pause" disabled>Play</button>
        <button id="btn-next-frame" disabled>Next &raquo;</button>
      </div>
    </div>
  </div>

  <!-- Main App Script -->
  <script src="app.js?v=1.0.3"></script>
</body>
</html>
